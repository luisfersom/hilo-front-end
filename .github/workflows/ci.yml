name: Integración continua · Docker
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test-build-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: 3.13.3
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Instalar dependencias frontend
        run: npm ci
      - name: Probar frontend
        run: npm test
      - name: Compilar frontend
        run: npm run build
      - name: Instalar dependencias backend
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Compilar y probar backend
        working-directory: backend
        run: |
          python -m compileall -q app.py
          python -m unittest discover -s tests -v
      - name: Validar Compose
        run: docker compose config --quiet
      - name: Construir imagen frontend
        run: docker compose build frontend
      - name: Construir imagen backend
        run: docker compose build backend
      - name: Iniciar servicios saludables
        run: docker compose up -d --wait --wait-timeout 120
      - name: Verificar conexión entre contenedores
        run: docker compose exec -T frontend wget -qO- http://backend:3001/api/status
      - name: Guardar y consultar mediante el frontend
        run: python tests/integration.py
      - name: Recrear servicios conservando el volumen
        run: |
          docker compose down
          docker compose up -d --wait --wait-timeout 120
          python tests/integration.py --verify-persistence
      - name: Mostrar evidencia y logs
        if: always()
        run: |
          docker compose ps -a
          docker compose logs --no-color
      - name: Limpiar recursos de CI
        if: always()
        run: docker compose down --volumes --remove-orphans
